name: Accessibility

on:
  pull_request:
    branches:
      - main
      - next
    paths:
      - '.github/workflows/accessibility.yml'
      - 'package.json'
      - 'playwright.config.*'
      - 'svelte.config.*'
      - 'vite.config.*'
      - 'wrangler.jsonc'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'static/**'
      - 'tests/**'
  push:
    branches:
      - main
      - next
    paths:
      - '.github/workflows/accessibility.yml'
      - 'package.json'
      - 'playwright.config.*'
      - 'svelte.config.*'
      - 'vite.config.*'
      - 'wrangler.jsonc'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'static/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set Up PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest

      - name: Set Up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm ci

      - name: Run Accessibility Audit
        shell: bash
        run: pnpm run test:ci
